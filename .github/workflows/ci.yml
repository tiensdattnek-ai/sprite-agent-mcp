name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run smoke
      - name: Verify source integrity
        run: npm run verify
      - name: Generate demo pack (art output smoke)
        run: npm run demo
      - name: Assert demo artifacts exist
        run: |
          test -f sprite-output/demo/index.html
          test "$(find sprite-output/demo -name '*.gif' | wc -l)" -ge 5
          test "$(find sprite-output/demo -name '*_gallery.html' | wc -l)" -ge 6

  policy:
    name: Read-only policy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Write guard must refuse source edits
        run: node scripts/guard-check.mjs
